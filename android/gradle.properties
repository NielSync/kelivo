# Local machine has 7.7 GB RAM; upstream requests -Xmx8G/-XX:MaxMetaspaceSize=4G.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# 8GB machine: uncapped workers each request ~2.3GB and livelock the build
# expiring memory-starved worker daemons (observed 55-minute stalls).
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m
