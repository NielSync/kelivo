name: Sync with upstream & build debug APK

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (09:00 local)

permissions:
  contents: write

concurrency:
  group: sync-build
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "NielSync"
          git config user.email "NielSync@users.noreply.github.com"

      - name: Merge upstream/master
        id: sync
        run: |
          git remote add upstream https://github.com/Chevey339/kelivo.git
          git fetch upstream master
          before="$(git rev-parse HEAD)"
          if git merge --no-edit upstream/master; then
            # GITHUB_TOKEN cannot push commits that change workflow files.
            # Keep our .github/workflows as-is across syncs so the push is
            # always legal; upstream's are manual-only and unused here.
            if git diff --name-only "$before" HEAD -- .github/workflows/ | grep -q .; then
              git rm -rqf .github/workflows/
              git checkout "$before" -- .github/workflows/
              git commit --amend --no-edit >/dev/null
              echo "Discarded upstream .github/workflows changes (GITHUB_TOKEN limitation)."
            fi
            after="$(git rev-parse HEAD)"
            if [ "$after" != "$before" ]; then
              echo "state=changed" >> "$GITHUB_OUTPUT"
            else
              echo "state=up-to-date" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "Merge conflict: upstream touched the same lines as fork changes. Resolve locally."
            exit 1
          fi

      - name: Push synced master
        if: steps.sync.outputs.state == 'changed'
        run: git push origin master

  build:
    name: Build debug APK
    needs: sync
    # Build even when upstream had nothing new, so every button press
    # produces an APK. Skipped only when the sync hit a conflict.
    if: ${{ always() && needs.sync.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/rust /usr/share/rust \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/extras || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
